services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: backend_starter
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d backend_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
